<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="t">
<title id="t">Thus Spoke Zarathustra — the sun-serpent staff-head roundel over four solar watches</title>
<defs>
<pattern id="zhatch" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<line x1="0" y1="0" x2="0" y2="13" stroke="#e8a93d" stroke-width="1.6" opacity=".4"/>
</pattern>
</defs>
<!-- abyssal lapis-black #0A0E21 -->
<rect width="800" height="1000" fill="#0a0e21"/>
<!-- four watches of one solar day: dawn / night / noon / ember-morning bands -->
<g>
<rect x="60" y="700" width="680" height="60" fill="#1b2350"/>
<rect x="60" y="770" width="680" height="60" fill="#0a0e21" stroke="#1b2350" stroke-width="2"/>
<rect x="60" y="840" width="680" height="60" fill="#1b2350"/>
<rect x="60" y="910" width="680" height="60" fill="#2a1a14"/>
<!-- dawn: cresting sun -->
<circle cx="200" cy="770" r="34" fill="#e8a93d"/>
<rect x="140" y="770" width="120" height="10" fill="#0a0e21"/>
<!-- night: eclipsed disc + star points -->
<circle cx="400" cy="800" r="30" fill="none" stroke="#7a8b5a" stroke-width="6"/>
<g fill="#f2e7cf"><circle cx="340" cy="790" r="3.4"/><circle cx="460" cy="810" r="3.4"/><circle cx="400" cy="762" r="2.6"/></g>
<!-- noon: full blaze -->
<circle cx="600" cy="870" r="30" fill="#ffe9b8"/>
<circle cx="600" cy="870" r="44" fill="none" stroke="#e8a93d" stroke-width="3"/>
<!-- ember-morning: ember disc rekindling -->
<circle cx="200" cy="940" r="30" fill="#c8502e"/>
<path d="M200,910 A30,30 0 0 1 230,940 L200,940 Z" fill="#e8a93d"/>
</g>
<!-- the staff: golden haft rising through the composition -->
<rect x="388" y="180" width="24" height="480" fill="#8a6420"/>
<rect x="388" y="180" width="8" height="480" fill="#e8a93d" opacity=".7"/>
<!-- THE ROUNDEL: rayed disc + coiled serpent (the book's own emblem) -->
<g transform="translate(400,330)">
<!-- engraved ray field: flat paths, no glow -->
<g fill="#e8a93d">
<polygon points="0,-218 13,-150 -13,-150"/><polygon points="0,-218 13,-150 -13,-150" transform="rotate(20)"/><polygon points="0,-218 13,-150 -13,-150" transform="rotate(40)"/><polygon points="0,-218 13,-150 -13,-150" transform="rotate(60)"/><polygon points="0,-218 13,-150 -13,-150" transform="rotate(80)"/><polygon points="0,-218 13,-150 -13,-150" transform="rotate(100)"/><polygon points="0,-218 13,-150 -13,-150" transform="rotate(120)"/><polygon points="0,-218 13,-150 -13,-150" transform="rotate(140)"/><polygon points="0,-218 13,-150 -13,-150" transform="rotate(160)"/><polygon points="0,-218 13,-150 -13,-150" transform="rotate(180)"/><polygon points="0,-218 13,-150 -13,-150" transform="rotate(200)"/><polygon points="0,-218 13,-150 -13,-150" transform="rotate(220)"/><polygon points="0,-218 13,-150 -13,-150" transform="rotate(240)"/><polygon points="0,-218 13,-150 -13,-150" transform="rotate(260)"/><polygon points="0,-218 13,-150 -13,-150" transform="rotate(280)"/><polygon points="0,-218 13,-150 -13,-150" transform="rotate(300)"/><polygon points="0,-218 13,-150 -13,-150" transform="rotate(320)"/><polygon points="0,-218 13,-150 -13,-150" transform="rotate(340)"/>
</g>
<circle r="120" fill="#e8a93d"/>
<circle r="120" fill="url(#zhatch)" opacity=".5"/>
<circle r="120" fill="none" stroke="#ffe9b8" stroke-width="3.4"/>
<circle r="92" fill="none" stroke="#8a5a20" stroke-width="2"/>
<!-- serpent coiled about the sun: three wraps -->
<g fill="none" stroke="#7a8b5a" stroke-linecap="round">
<path d="M-118,-20 C-60,-70 60,-70 118,-20" stroke-width="22"/>
<path d="M-118,-20 C-60,-70 60,-70 118,-20" stroke="#3a4a2e" stroke-width="22" stroke-dasharray="5 30" opacity=".9"/>
<path d="M-104,44 C-50,8 50,8 104,44" stroke-width="20"/>
<path d="M-104,44 C-50,8 50,8 104,44" stroke="#3a4a2e" stroke-width="20" stroke-dasharray="5 28" opacity=".9"/>
<path d="M-70,96 C-30,70 30,70 70,96" stroke-width="17"/>
</g>
<!-- serpent head cresting the disc -->
<g transform="translate(118,-20)">
<ellipse cx="18" cy="-6" rx="30" ry="19" fill="#7a8b5a" stroke="#2e3a24" stroke-width="3" transform="rotate(-18)"/>
<circle cx="28" cy="-12" r="3.6" fill="#0a0e21"/>
<path d="M44,-2 L70,-2 M70,-2 L62,-10 M70,-2 L62,6" stroke="#c8502e" stroke-width="3.2" fill="none"/>
</g>
</g>
<!-- seal ring inscriptions: four part-seal arcs -->
<g fill="none" stroke="#e8a93d" stroke-width="2.4" opacity=".8">
<path d="M120,130 A90,90 0 0 1 300,130"/>
<path d="M500,130 A90,90 0 0 1 680,130"/>
</g>
<g fill="#e8a93d" opacity=".9">
<circle cx="210" cy="130" r="7"/><circle cx="590" cy="130" r="7"/>
</g>
<g stroke="#f2e7cf" stroke-width="2" opacity=".7">
<line x1="120" y1="160" x2="300" y2="160"/><line x1="500" y1="160" x2="680" y2="160"/>
</g>
<!-- lion-and-doves finale mark at the foot -->
<g transform="translate(560,940)" stroke="#e8a93d" stroke-width="3" fill="none" opacity=".9">
<circle r="24"/>
<path d="M-10,6 Q0,-6 10,6 M-10,6 Q0,0 10,6"/>
</g>
<rect x="14" y="14" width="772" height="972" fill="none" stroke="#e8a93d" stroke-width="3" opacity=".85"/>
</svg>
