    <path d="M70 120 l 12 6 l 2 14 M330 400 l -12 -4 l -4 -12 M64 400 l 14 -2 l 6 12" fill="none" stroke="#000" stroke-width="7"/>
    <path d="M150 40 l 8 8 l -4 10 M300 60 l -8 8 l 2 10" fill="none" stroke="#000" stroke-width="6"/>
  </mask>
  <g mask="url(#cov-g)">
