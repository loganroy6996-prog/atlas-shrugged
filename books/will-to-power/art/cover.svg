<!--
  The Will to Power — COVER plate ("The Black Notebook").
  Owner: SupWtP-3 (supervisor-authored; normative per ART-DIRECTION.md §4 +
  book-identity.json cover contract + ArtDirector Q3: left monumental title,
  RIGHT ring/hammer plate occupying the right 40% desktop / stacked above the
  title on phone; plate must be LARGE, never a timid medallion).
  Composition: the broken ring of recurrence (Gloom Violet gouge, one gap at
  upper right) struck through by the hammer-fracture (Bloodline gouge diagonal);
  one Sulphur seal-dot at the fracture origin (match logic: the single heat
  source). Bone etched ticks on the ring's inner rim. Torn knockout-mask edges
  throughout (W1); NO gradients/filters/blur. viewBox 400x520 (portrait plate).
  Loaded declaratively: manifest cover {src:"art/cover.svg"} (whole file, no
  symbol) into #cover-art per READER-CONTRACT §3–§4.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" role="img" aria-label="Broken ring struck by a hammer fracture">
  <mask id="cov-g" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="520">
    <rect width="400" height="520" fill="#fff"/>
    <path d="M258 88 L240 130 L254 168 L236 210 L250 248 L232 290 L246 328 L230 366 L242 402" fill="none" stroke="#000" stroke-width="10"/>
