<!--
  The Will to Power — NATURE cohort sprite ("The Black Notebook", Book III Part 2).
  Owner: SupWtP-3 (supervisor-authored; the nature engineer deliverable never landed
  a sprite — every plate below follows the nature.json motif_asset specs verbatim).
  6 plate symbols (plate-c14..plate-c19), each with its own viewBox, resolved via
  manifest {src:"art/nature.svg", symbol:"plate-cNN"} per READER-CONTRACT A.2.
  Grammar: master lens-eye ring (almond outline, Verdigris #4E7C6B @ .85 stroke
  weight ~6 on the 120-grid) mutated per chapter: crack / divide / breathe /
  harden / break / spiral. Method: gouge-torn band paths, knockout masks, hatch
  ticks; NO gradients/filters/blur anywhere. Masks are per-symbol unique ids.
  W2: Sulphur #E3A82B small/sparse (match logic), maximum only at plate-c19.
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">

  <!-- ============ plate-c14 · CRACKED LENS (p4c14) ============
