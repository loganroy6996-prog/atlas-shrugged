<!-- SOLAR GOSPEL seal masters. Owner: ZaraShellEngineer. Status: final v1.
     12 Contract <symbol>s for the reader.js slot path (A.2: clones symbol
     children into a fresh <svg>, so symbols are SELF-CONTAINED: no <use>,
     no cross-symbol references, no external defs) + raw positioned image
     cells with <view> crops for CSS image-context use (fragments on symbols
     do NOT crop in image context; the <view> elements below are the only
     fragment targets in url()).
     Palette: night #0A0E21 / lapis #1B2350 / solar #E8A93D / ember #C8502E /
     serpent #7A8B5A / bone #F2E7CF. currentColor = bone in slot context.
     Z1 firewall: flat engraved line-work only — no gradients, no filters,
     no glow, no drop-shadow. Legends are the only <text> in this file. -->
