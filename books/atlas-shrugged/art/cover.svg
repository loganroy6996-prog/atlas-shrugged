<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" role="img" aria-label="Night signal plate: a green lamp burning over converging rails">
  <rect x="0" y="0" width="640" height="760" fill="#07090C"/>
  <rect x="0" y="0" width="640" height="330" fill="#0E1216"/>
  <g fill="#F2E8D0" opacity="0.55">
    <circle cx="52" cy="46" r="2"/><circle cx="140" cy="90" r="1.6"/><circle cx="238" cy="40" r="2"/>
    <circle cx="330" cy="80" r="1.6"/><circle cx="430" cy="44" r="2"/><circle cx="520" cy="96" r="1.6"/>
    <circle cx="588" cy="52" r="2"/><circle cx="96" cy="160" r="1.5"/><circle cx="300" cy="150" r="1.5"/>
    <circle cx="470" cy="170" r="1.5"/><circle cx="560" cy="180" r="1.5"/><circle cx="190" cy="200" r="1.5"/>
  </g>
  <!-- signal bridge -->
  <rect x="60" y="228" width="520" height="14" fill="#141A20" stroke="#8B98A5" stroke-width="2"/>
  <rect x="84" y="242" width="10" height="120" fill="#8B98A5"/>
  <rect x="546" y="242" width="10" height="120" fill="#8B98A5"/>
  <!-- signal head: green CLEAR aspect lit -->
  <rect x="286" y="150" width="68" height="150" fill="#141A20" stroke="#8B98A5" stroke-width="3"/>
  <circle cx="320" cy="182" r="16" fill="#1C242C" stroke="#8B98A5" stroke-width="2"/>
  <circle cx="320" cy="225" r="16" fill="#3FD08C"/>
  <circle cx="320" cy="225" r="22" fill="none" stroke="#3FD08C" stroke-width="2"/>
  <circle cx="320" cy="268" r="16" fill="#1C242C" stroke="#8B98A5" stroke-width="2"/>
  <rect x="312" y="300" width="16" height="62" fill="#8B98A5"/>
  <!-- converging rails -->
  <polygon points="320,380 120,760 190,760" fill="#F2E8D0" opacity="0.9"/>
  <polygon points="320,380 520,760 450,760" fill="#F2E8D0" opacity="0.9"/>
  <polygon points="320,380 300,760 340,760" fill="#3FD08C" opacity="0.4"/>
  <g fill="#3FD08C" opacity="0.85">
    <rect x="272" y="398" width="96" height="6"/>
    <rect x="246" y="430" width="148" height="7"/>
    <rect x="214" y="468" width="212" height="8"/>
    <rect x="176" y="514" width="288" height="9"/>
    <rect x="132" y="568" width="376" height="10"/>
    <rect x="82" y="632" width="476" height="11"/>
    <rect x="36" y="700" width="568" height="12"/>
  </g>
  <rect x="0" y="742" width="640" height="18" fill="#0E1216"/>
</svg>
