<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 850" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Noon sun rising over a dark sea, ringed by vermilion dancers">
  <defs>
    <path id="gs-spark" d="M0,-15 C2.5,-4 4,-2.5 15,0 C4,2.5 2.5,4 0,15 C-2.5,4 -4,2.5 -15,0 C-4,-2.5 -2.5,-4 0,-15 Z"/>
    <g id="gs-leap" fill="#e4572e">
      <circle cx="7" cy="-42" r="10.5"/>
      <path d="M5,-33 C-9,-31 -23,-36 -34,-47 L-25,-55 C-15,-45 -2,-41 8,-41 Z"/>
      <path d="M10,-32 C19,-39 24,-49 25,-61 L36,-58 C35,-44 28,-32 15,-26 Z"/>
      <path d="M5,-33 C-2,-21 -2,-6 4,7 L15,4 C10,-9 11,-23 17,-32 Z"/>
      <path d="M4,7 C-7,13 -19,13 -30,7 L-26,-3 C-17,1 -7,1 1,-5 Z"/>
      <path d="M15,4 C25,7 35,4 43,-3 L38,-12 C30,-6 20,-4 11,-7 Z"/>
    </g>
    <g id="gs-reach" fill="#e4572e">
      <circle cx="-5" cy="-31" r="10.5"/>
      <path d="M-7,-22 C-20,-27 -29,-38 -32,-52 L-22,-55 C-19,-42 -10,-32 2,-28 Z"/>
      <path d="M1,-24 C12,-31 18,-42 19,-55 L30,-52 C29,-37 21,-25 7,-19 Z"/>
      <path d="M-4,-23 C-11,-11 -12,3 -6,16 L5,13 C0,-1 2,-14 8,-23 Z"/>
      <path d="M-6,16 C-17,21 -29,20 -39,13 L-34,4 C-26,10 -16,10 -7,4 Z"/>
      <path d="M5,13 C12,23 12,34 5,44 L15,47 C23,36 22,22 12,11 Z"/>
    </g>
    <g id="gs-spin" fill="#e4572e">
      <circle cx="0" cy="-27" r="10.5"/>
      <path d="M-2,-18 C-15,-14 -28,-15 -40,-22 L-35,-32 C-24,-26 -12,-25 -1,-29 Z"/>
      <path d="M3,-19 C15,-25 23,-35 26,-47 L36,-42 C33,-28 24,-17 10,-13 Z"/>
      <path d="M0,-18 C-6,-6 -5,7 2,18 L13,13 C7,3 6,-9 12,-19 Z"/>
      <path d="M2,18 C-8,23 -19,23 -29,17 L-24,8 C-16,13 -6,12 1,6 Z"/>
      <path d="M13,13 C23,14 32,10 38,2 L31,-5 C25,1 17,3 9,4 Z"/>
    </g>
    <path id="gs-gull" d="M0,0 Q9,-9 18,0 Q27,-9 36,0" fill="none" stroke="#f3ead8" stroke-width="3.5" stroke-linecap="round"/>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="1600" height="680" fill="#0a2e3b"/>
  <rect x="0" y="0" width="1600" height="240" fill="#04161d" opacity="0.55"/>
  <rect x="0" y="560" width="1600" height="100" fill="#f5b301" opacity="0.10"/>

  <!-- wedge rays (mural fan) -->
  <g transform="translate(800,470)" opacity="0.9">
    <g fill="#f5b301">
      <path d="M0,0 L-46,-560 L46,-560 Z" opacity="0.10"/>
      <path d="M0,0 L-46,-560 L46,-560 Z" opacity="0.10" transform="rotate(30)"/>
      <path d="M0,0 L-46,-560 L46,-560 Z" opacity="0.10" transform="rotate(60)"/>
      <path d="M0,0 L-46,-560 L46,-560 Z" opacity="0.10" transform="rotate(90)"/>
      <path d="M0,0 L-46,-560 L46,-560 Z" opacity="0.10" transform="rotate(120)"/>
      <path d="M0,0 L-46,-560 L46,-560 Z" opacity="0.10" transform="rotate(150)"/>
      <path d="M0,0 L-46,-560 L46,-560 Z" opacity="0.10" transform="rotate(180)"/>
      <path d="M0,0 L-46,-560 L46,-560 Z" opacity="0.10" transform="rotate(210)"/>
      <path d="M0,0 L-46,-560 L46,-560 Z" opacity="0.10" transform="rotate(240)"/>
      <path d="M0,0 L-46,-560 L46,-560 Z" opacity="0.10" transform="rotate(270)"/>
      <path d="M0,0 L-46,-560 L46,-560 Z" opacity="0.10" transform="rotate(300)"/>
      <path d="M0,0 L-46,-560 L46,-560 Z" opacity="0.10" transform="rotate(330)"/>
    </g>
    <g stroke-linecap="round">
      <line x1="0" y1="-205" x2="0" y2="-560" stroke="#f5b301" stroke-width="7" opacity="0.5"/>
      <line x1="0" y1="-205" x2="0" y2="-560" stroke="#e4572e" stroke-width="5" opacity="0.55" transform="rotate(15)"/>
      <line x1="0" y1="-205" x2="0" y2="-560" stroke="#f5b301" stroke-width="7" opacity="0.5" transform="rotate(30)"/>
      <line x1="0" y1="-205" x2="0" y2="-560" stroke="#e4572e" stroke-width="5" opacity="0.55" transform="rotate(45)"/>
      <line x1="0" y1="-205" x2="0" y2="-560" stroke="#f5b301" stroke-width="7" opacity="0.5" transform="rotate(60)"/>
      <line x1="0" y1="-205" x2="0" y2="-560" stroke="#e4572e" stroke-width="5" opacity="0.55" transform="rotate(75)"/>
      <line x1="0" y1="-205" x2="0" y2="-560" stroke="#f5b301" stroke-width="7" opacity="0.5" transform="rotate(90)"/>
      <line x1="0" y1="-205" x2="0" y2="-560" stroke="#e4572e" stroke-width="5" opacity="0.55" transform="rotate(105)"/>
      <line x1="0" y1="-205" x2="0" y2="-560" stroke="#f5b301" stroke-width="7" opacity="0.5" transform="rotate(120)"/>
      <line x1="0" y1="-205" x2="0" y2="-560" stroke="#e4572e" stroke-width="5" opacity="0.55" transform="rotate(135)"/>
      <line x1="0" y1="-205" x2="0" y2="-560" stroke="#f5b301" stroke-width="7" opacity="0.5" transform="rotate(150)"/>
      <line x1="0" y1="-205" x2="0" y2="-560" stroke="#e4572e" stroke-width="5" opacity="0.55" transform="rotate(165)"/>
      <line x1="0" y1="-205" x2="0" y2="-560" stroke="#f5b301" stroke-width="7" opacity="0.5" transform="rotate(180)"/>
      <line x1="0" y1="-205" x2="0" y2="-560" stroke="#e4572e" stroke-width="5" opacity="0.55" transform="rotate(195)"/>
      <line x1="0" y1="-205" x2="0" y2="-560" stroke="#f5b301" stroke-width="7" opacity="0.5" transform="rotate(210)"/>
      <line x1="0" y1="-205" x2="0" y2="-560" stroke="#e4572e" stroke-width="5" opacity="0.55" transform="rotate(225)"/>
      <line x1="0" y1="-205" x2="0" y2="-560" stroke="#f5b301" stroke-width="7" opacity="0.5" transform="rotate(240)"/>
      <line x1="0" y1="-205" x2="0" y2="-560" stroke="#e4572e" stroke-width="5" opacity="0.55" transform="rotate(255)"/>
      <line x1="0" y1="-205" x2="0" y2="-560" stroke="#f5b301" stroke-width="7" opacity="0.5" transform="rotate(270)"/>
      <line x1="0" y1="-205" x2="0" y2="-560" stroke="#e4572e" stroke-width="5" opacity="0.55" transform="rotate(285)"/>
      <line x1="0" y1="-205" x2="0" y2="-560" stroke="#f5b301" stroke-width="7" opacity="0.5" transform="rotate(300)"/>
      <line x1="0" y1="-205" x2="0" y2="-560" stroke="#e4572e" stroke-width="5" opacity="0.55" transform="rotate(315)"/>
      <line x1="0" y1="-205" x2="0" y2="-560" stroke="#f5b301" stroke-width="7" opacity="0.5" transform="rotate(330)"/>
      <line x1="0" y1="-205" x2="0" y2="-560" stroke="#e4572e" stroke-width="5" opacity="0.55" transform="rotate(345)"/>
    </g>
  </g>

  <!-- sun: flat mural disc, hard rings only (G4) -->
  <circle cx="800" cy="470" r="196" fill="none" stroke="#f5b301" stroke-width="3" opacity="0.5"/>
  <circle cx="800" cy="470" r="184" fill="none" stroke="#f5b301" stroke-width="2" opacity="0.35"/>
  <circle cx="800" cy="470" r="172" fill="#f8c51c"/>
  <circle cx="800" cy="470" r="172" fill="none" stroke="#ffedbe" stroke-width="4" opacity="0.85"/>
  <circle cx="800" cy="470" r="140" fill="none" stroke="#ffedbe" stroke-width="2" opacity="0.35"/>

  <!-- dance ring: BROKEN ring, six varied gestures radiating outward -->
  <g>
    <use href="#gs-leap" transform="translate(452,398) rotate(238) scale(1.15)"/>
    <use href="#gs-reach" transform="translate(576,280) rotate(268) scale(1.05)"/>
    <use href="#gs-spin" transform="translate(712,222) rotate(8) scale(1.15)"/>
    <use href="#gs-leap" transform="translate(888,222) rotate(352) scale(-1.05,1.05)"/>
    <use href="#gs-spin" transform="translate(1028,284) rotate(272) scale(1.1)"/>
    <use href="#gs-reach" transform="translate(1152,396) rotate(296) scale(-1.15,1.15)"/>
  </g>
  <!-- hand-hold arcs between neighbors (broken at the base) -->
  <g fill="none" stroke="#e4572e" stroke-width="6" stroke-linecap="round" opacity="0.7">
    <path d="M496,344 Q532,308 560,296"/>
    <path d="M648,262 Q684,244 706,240"/>
    <path d="M812,238 Q848,242 876,258"/>
    <path d="M964,296 Q996,312 1022,348"/>
  </g>
  <!-- dance sparks -->
  <g fill="#e4572e">
    <circle cx="404" cy="470" r="6" opacity="0.8"/>
    <circle cx="1196" cy="470" r="6" opacity="0.8"/>
    <circle cx="640" cy="176" r="5" opacity="0.7"/>
    <circle cx="960" cy="176" r="5" opacity="0.7"/>
    <circle cx="800" cy="118" r="6" opacity="0.8"/>
  </g>

  <!-- stars (stellar morals) -->
  <g fill="#f3ead8">
    <use href="#gs-spark" transform="translate(150,140) scale(1.1)" opacity="0.9"/>
    <use href="#gs-spark" transform="translate(250,90) scale(0.6)" opacity="0.7"/>
    <use href="#gs-spark" transform="translate(90,300) scale(0.7)" opacity="0.7"/>
    <use href="#gs-spark" transform="translate(1450,140) scale(1.1)" opacity="0.9"/>
    <use href="#gs-spark" transform="translate(1350,90) scale(0.6)" opacity="0.7"/>
    <use href="#gs-spark" transform="translate(1510,300) scale(0.7)" opacity="0.7"/>
    <use href="#gs-spark" transform="translate(1330,470) scale(0.5)" opacity="0.6" fill="#f5b301"/>
    <use href="#gs-spark" transform="translate(270,470) scale(0.5)" opacity="0.6" fill="#f5b301"/>
  </g>

  <!-- gulls of the Vogelfrei -->
  <g opacity="0.8">
    <use href="#gs-gull" transform="translate(300,540)"/>
    <use href="#gs-gull" transform="translate(360,570) scale(0.7)"/>
    <use href="#gs-gull" transform="translate(1264,540)"/>
    <use href="#gs-gull" transform="translate(1204,570) scale(0.7)"/>
  </g>

  <!-- sea -->
  <rect x="0" y="660" width="1600" height="90" fill="#0d3a48"/>
  <rect x="0" y="750" width="1600" height="100" fill="#07232d"/>
  <line x1="0" y1="660" x2="1600" y2="660" stroke="#f3ead8" stroke-width="2.5" opacity="0.4"/>

  <!-- sun road: gold reflection column -->
  <g fill="#f5b301" stroke-linecap="round">
    <rect x="700" y="682" width="200" height="10" rx="5" opacity="0.5"/>
    <rect x="716" y="706" width="168" height="9" rx="4.5" opacity="0.42"/>
    <rect x="730" y="728" width="140" height="9" rx="4.5" opacity="0.36"/>
    <rect x="742" y="752" width="116" height="8" rx="4" opacity="0.3"/>
    <rect x="752" y="776" width="96" height="8" rx="4" opacity="0.26"/>
  </g>

  <!-- wave crests -->
  <g fill="none" stroke="#f3ead8" stroke-linecap="round">
    <path d="M-20,716 q80,-26 160,0 t160,0 t160,0 t160,0 t160,0 t160,0 t160,0 t160,0 t160,0 t160,0 t160,0" stroke-width="3" opacity="0.4"/>
    <path d="M-20,792 q80,-22 160,0 t160,0 t160,0 t160,0 t160,0 t160,0 t160,0 t160,0 t160,0 t160,0 t160,0" stroke-width="2.5" opacity="0.28"/>
  </g>
  <g fill="none" stroke="#f5b301" stroke-linecap="round" opacity="0.3">
    <path d="M-20,710 q80,-20 160,0 t160,0 t160,0 t160,0 t160,0 t160,0 t160,0 t160,0 t160,0 t160,0 t160,0" stroke-width="2"/>
  </g>

  <!-- outlaw ship crossing the horizon -->
  <g transform="translate(1240,0)">
    <line x1="0" y1="628" x2="0" y2="548" stroke="#02090d" stroke-width="7"/>
    <path d="M0,552 L-64,624 L0,624 Z" fill="#0a1016" stroke="#f3ead8" stroke-width="1.5" opacity="0.95"/>
    <path d="M6,560 L58,624 L6,624 Z" fill="#0a1016" stroke="#f3ead8" stroke-width="1.5" opacity="0.95"/>
    <path d="M-72,628 L72,628 L52,656 L-52,656 Z" fill="#02090d"/>
    <line x1="-72" y1="628" x2="72" y2="628" stroke="#f3ead8" stroke-width="2" opacity="0.5"/>
    <circle cx="0" cy="542" r="6" fill="#ffb84d"/>
    <circle cx="0" cy="542" r="11" fill="none" stroke="#ffb84d" stroke-width="2.5" opacity="0.8"/>
  </g>

</svg>
