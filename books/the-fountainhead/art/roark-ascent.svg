<?xml version="1.0" encoding="UTF-8"?>
<!-- The Fountainhead · p4c20 ASCENT finale plate (ROARK cohort, FURNACE grammar).
     Original authored SVG. Kent-symmetric triptych in Furnace means: the ocean
     mounting as the city descends (left) / the sky field with the cantilever
     platform and the lone figure of Howard Roark (center) / the three crowns
     Dominique's hoist passes — bank pinnacle, courthouse crown, church spire —
     descending (right). Prose-verified: 'She passed the pinnacles of bank
     buildings. She passed the crowns of courthouses. She rose above the spires
     of churches' (para 11); 'only the ocean and the sky and the figure of
     Howard Roark' (para 12); the tin plate 'Howard Roark, Architect' (para 4).
     Flat gouache-poster: slabs, two linear gradients (ocean rise, sky heat),
     single hearth radial, strokes ≥2px; no lattice, no glow filters. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="r20-title">
  <title id="r20-title">Chapter XX — the ascent: ocean, sky, and the figure of Howard Roark</title>
  <defs>
    <linearGradient id="r20-ocean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E4A3A"/>
      <stop offset="0.6" stop-color="#241610"/>
      <stop offset="1" stop-color="#17100B"/>
    </linearGradient>
    <linearGradient id="r20-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33200F"/>
      <stop offset="0.55" stop-color="#8C3A20"/>
      <stop offset="1" stop-color="#E4572E"/>
    </linearGradient>
    <radialGradient id="r20-hearth" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD9A0"/>
      <stop offset="0.55" stop-color="#E4572E" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#E4572E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="520" fill="#17100B"/>

  <!-- Left register · the ocean mounting -->
  <rect x="40" y="120" width="300" height="360" fill="url(#r20-ocean)"/>
  <rect x="40" y="120" width="300" height="6" fill="#7FB08A"/>
  <rect x="40" y="180" width="300" height="4" fill="#F6EAD6" opacity="0.5"/>
  <rect x="40" y="260" width="300" height="4" fill="#F6EAD6" opacity="0.35"/>
  <rect x="40" y="340" width="300" height="4" fill="#F6EAD6" opacity="0.25"/>
  <rect x="40" y="120" width="300" height="360" fill="none" stroke="#7A6A58" stroke-width="3"/>
  <rect x="100" y="420" width="180" height="30" fill="#241610" stroke="#C8A06A" stroke-width="2"/>
  <text x="190" y="441" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="15" letter-spacing="3" fill="#F6EAD6">ROARK</text>

  <!-- Center register · the sky field, the platform, the figure -->
  <rect x="380" y="40" width="440" height="440" fill="url(#r20-sky)" opacity="0.85"/>
  <rect x="380" y="40" width="440" height="440" fill="none" stroke="#C8A06A" stroke-width="3"/>
  <ellipse cx="600" cy="150" rx="150" ry="70" fill="url(#r20-hearth)" opacity="0.8"/>
  <rect x="400" y="330" width="400" height="26" fill="#F6EAD6"/>
  <rect x="400" y="330" width="400" height="8" fill="#E4572E"/>
  <rect x="560" y="356" width="24" height="124" fill="#7A6A58"/>
  <rect x="560" y="356" width="24" height="8" fill="#C8A06A"/>
  <g fill="#17100B">
    <rect x="592" y="252" width="16" height="46"/>
    <circle cx="600" cy="240" r="11"/>
    <rect x="584" y="298" width="8" height="32"/><rect x="608" y="298" width="8" height="32"/>
  </g>
  <rect x="588" y="252" width="4" height="78" fill="#FFD9A0"/>
  <text x="600" y="110" text-anchor="middle" font-family="Oswald, 'Arial Narrow', sans-serif" font-weight="700" font-size="72" fill="#F6EAD6">XX</text>

  <!-- Right register · the three crowns descending -->
  <rect x="860" y="120" width="300" height="360" fill="#100B08"/>
  <rect x="860" y="120" width="300" height="360" fill="none" stroke="#7A6A58" stroke-width="3"/>
  <polygon points="940,170 970,120 1000,170" fill="#7A6A58"/>
  <rect x="946" y="170" width="48" height="60" fill="#241610"/>
  <rect x="1030" y="150" width="80" height="22" fill="#7A6A58"/>
  <rect x="1030" y="172" width="80" height="58" fill="#241610"/>
  <rect x="1030" y="150" width="80" height="6" fill="#C8A06A"/>
  <polygon points="960,330 980,260 1000,330" fill="#C8A06A"/>
  <rect x="972" y="330" width="16" height="70" fill="#241610"/>
  <rect x="1040" y="300" width="60" height="100" fill="#241610"/>
  <polygon points="1040,300 1070,262 1100,300" fill="#7A6A58"/>
  <rect x="860" y="440" width="300" height="4" fill="#E4572E"/>

  <!-- Foot · closing rule; the end-state diamond seal is composed in CSS
       (inline SVG url art) so it rides with the final paragraph. -->
  <rect x="40" y="496" width="1120" height="6" fill="#E4572E"/>
  <rect x="40" y="496" width="1120" height="2" fill="#FFD9A0"/>
</svg>
