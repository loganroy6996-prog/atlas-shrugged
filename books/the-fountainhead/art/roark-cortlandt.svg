<?xml version="1.0" encoding="UTF-8"?>
<!-- The Fountainhead · p4c19 aftermath-farewell plate (ROARK cohort, FURNACE grammar).
     Original authored SVG. NOT a courtroom (supervisor ruling Q1): the 9-o'clock
     press-stop + the signed contract + the clean hole. Three registers, all
     prose-verified: nickel key-rims glittering typewriter (para 20) + green-glass
     lamp (para 13) + dropped paper clip (para 26) / stopped press rolls + wrist
     watch at nine (paras 21-23) / clean-hole earth cut (para 0) + the masthead-gone
     door with its discolored rectangle (para 40) + four signed contract sheets
     (paras 46-56). Flat gouache-poster means: slabs, one linear heat gradient,
     strokes ≥2px; no lattice, no dimension lines, no glow filters. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="r19-title">
  <title id="r19-title">Chapter XIX — the Banner stops at nine; Cortlandt is rebuilt</title>
  <defs>
    <linearGradient id="r19-heat" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#E4572E"/>
      <stop offset="0.45" stop-color="#8C3A20"/>
      <stop offset="1" stop-color="#17100B"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="420" fill="#17100B"/>
  <rect x="0" y="0" width="1200" height="420" fill="url(#r19-heat)" opacity="0.45"/>

  <!-- Register 1 · the desk at the last minute: green lamp, typewriter, clip -->
  <rect x="70" y="34" width="200" height="26" fill="#1E4A3A"/>
  <rect x="70" y="34" width="200" height="6" fill="#7FB08A"/>
  <rect x="160" y="60" width="14" height="70" fill="#7A6A58"/>
  <rect x="120" y="130" width="94" height="10" fill="#7A6A58"/>
  <rect x="330" y="60" width="330" height="80" fill="#241610" stroke="#7A6A58" stroke-width="3"/>
  <rect x="330" y="60" width="330" height="10" fill="#C8A06A"/>
  <g fill="none" stroke="#C8A06A" stroke-width="3">
    <circle cx="370" cy="102" r="10"/><circle cx="410" cy="102" r="10"/><circle cx="450" cy="102" r="10"/>
    <circle cx="490" cy="102" r="10"/><circle cx="530" cy="102" r="10"/><circle cx="570" cy="102" r="10"/>
    <circle cx="610" cy="102" r="10"/>
  </g>
  <rect x="720" y="80" width="180" height="60" fill="#F6EAD6" opacity="0.9"/>
  <rect x="720" y="80" width="180" height="8" fill="#7A6A58"/>
  <ellipse cx="990" cy="112" rx="26" ry="12" fill="none" stroke="#C8A06A" stroke-width="4"/>
  <ellipse cx="990" cy="112" rx="12" ry="5" fill="none" stroke="#C8A06A" stroke-width="3"/>
  <rect x="70" y="150" width="1060" height="8" fill="#3A2C22"/>

  <!-- Register 2 · the presses stop: dead rolls + the wrist watch at nine -->
  <rect x="70" y="190" width="480" height="64" fill="#241610"/>
  <rect x="70" y="190" width="480" height="8" fill="#7A6A58"/>
  <g fill="#100B08">
    <rect x="110" y="206" width="60" height="40"/><rect x="190" y="206" width="60" height="40"/>
    <rect x="270" y="206" width="60" height="40"/><rect x="350" y="206" width="60" height="40"/>
    <rect x="430" y="206" width="60" height="40"/>
  </g>
  <g fill="#E4572E" opacity="0.7">
    <rect x="110" y="206" width="60" height="4"/><rect x="190" y="206" width="60" height="4"/>
    <rect x="270" y="206" width="60" height="4"/><rect x="350" y="206" width="60" height="4"/>
    <rect x="430" y="206" width="60" height="4"/>
  </g>
  <circle cx="700" cy="222" r="40" fill="#F6EAD6" stroke="#7A6A58" stroke-width="4"/>
  <line x1="700" y1="222" x2="700" y2="192" stroke="#17100B" stroke-width="5"/>
  <line x1="700" y1="222" x2="672" y2="222" stroke="#17100B" stroke-width="5"/>
  <circle cx="700" cy="222" r="5" fill="#E4572E"/>
  <rect x="640" y="176" width="120" height="12" fill="#3A2C22"/>
  <rect x="640" y="256" width="120" height="12" fill="#3A2C22"/>
  <rect x="800" y="190" width="330" height="64" fill="#100B08"/>
  <rect x="800" y="190" width="330" height="8" fill="#C8A06A"/>
  <text x="965" y="234" text-anchor="middle" font-family="Oswald, 'Arial Narrow', sans-serif" font-weight="600" font-size="36" letter-spacing="6" fill="#F6EAD6">NINE</text>
  <rect x="70" y="286" width="1060" height="8" fill="#E4572E"/>

  <!-- Register 3 · the clean hole + the masthead-less door + the contract -->
  <polygon points="70,392 70,318 250,318 210,392" fill="#0B0806"/>
  <polygon points="330,392 370,318 550,318 550,392" fill="#0B0806"/>
  <rect x="70" y="310" width="480" height="8" fill="#C8A06A"/>
  <rect x="620" y="310" width="170" height="82" fill="#241610" stroke="#7A6A58" stroke-width="3"/>
  <rect x="620" y="310" width="170" height="22" fill="#33200F" stroke="#8C3A20" stroke-width="2"/>
  <rect x="694" y="346" width="10" height="10" fill="#C8A06A"/>
  <g fill="#F6EAD6" opacity="0.92">
    <rect x="840" y="312" width="120" height="76" transform="rotate(-4 840 312)"/>
