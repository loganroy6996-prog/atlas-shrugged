  </g>
  <rect x="880" y="308" width="120" height="76" transform="rotate(3 880 308)" fill="none" stroke="#7A6A58" stroke-width="2"/>
  <line x1="892" y1="366" x2="986" y2="370" stroke="#8C3A20" stroke-width="3"/>
  <text x="150" y="292" font-family="Oswald, 'Arial Narrow', sans-serif" font-weight="700" font-size="64" fill="#E4572E">XIX</text>
  <rect x="70" y="396" width="1060" height="4" fill="#8C3A20"/>
</svg>
