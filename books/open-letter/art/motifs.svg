<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="mtTitle mtDesc">
<title id="mtTitle">Open Letter shared motif sheet: seals, rules, marginal devices, chapter end-marks</title>
<desc id="mtDesc">Fourteen chapter end-seals plus shared rules, cockade, wax seal, cartouche, redaction bar, and corner ornament in gilt, oxblood, newsprint on night ink.</desc>
