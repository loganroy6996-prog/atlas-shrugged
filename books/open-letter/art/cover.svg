<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="cvTitle cvDesc">
<title id="cvTitle">The Cathedral at night, dissolving into broadsheet columns</title>
<desc id="cvDesc">Engraved Gothic facade under a waning moon; its nave breaks apart into printed columns sealed with a white cockade.</desc>
