<linearGradient id="c5flame" x1="0" y1="1" x2="0" y2="0">
<stop offset="0" stop-color="#A83A2C"/><stop offset=".45" stop-color="#DFA050"/><stop offset="1" stop-color="#F4D9A0"/>
</linearGradient>
