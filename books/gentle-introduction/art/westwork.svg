<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="c5t c5d">
<title id="c5t">Plate V — The westwork: the Cathedral's portrait; twin towers, ten identical lit gallery openings, a blind oculus, three portals, one great candle</title>
<desc id="c5d">Nave flagship plate, engraved. The west front seen from the nave floor: twin tower masses flank a west wall carrying an upper gallery of ten small identical evenly-lit round-arched openings in two ranks, a central blind oculus with a gold heart, and three great pointed portals below, all whole and all ajar on darkness, the center portal taller. One great sanctuary candle burns before the center portal; five stepped wedges of light flood the foreground floor. Ten openings, no crown, no throne: coordination without a coordinator.</desc>
