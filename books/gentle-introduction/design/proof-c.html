<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cohort C proof — Doses IX–XI</title>
<style>
  body { margin: 0; background: #100F0D; color: #ECE2CE;
    font-family: Georgia, 'Times New Roman', serif; }
  header { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem 0; }
  header h1 { font-weight: 400; font-size: 1.4rem; letter-spacing: .04em; }
  header p { color: #9C917E; font-size: .95rem; }
  .plate { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }
  .plate h2 { font-weight: 400; font-size: 1.05rem; letter-spacing: .06em; color: #DFA050; }
  .plate svg, .plate img { width: 100%; height: auto; display: block; }
  .small { max-width: 1100px; margin: 0 auto; padding: 1.5rem; display: flex; gap: 1rem; flex-wrap: wrap; }
  .small figure { margin: 0; width: 200px; }
  .small img { width: 100%; height: auto; display: block; }
  .small figcaption { font-size: .8rem; color: #9C917E; margin-top: .4rem; }
</style>
</head>
<body>
<header>
  <h1>Cohort C — Crossing → Sanctuary (proof sheet)</h1>
  <p>Plates at full width, then at the 200px GI3 floor. Backdrop Narthex #100F0D.</p>
</header>
<section class="plate"><h2>Dose IX · The crossing</h2><img src="../art/crossing.svg" alt="crossing plate"></section>
<section class="plate"><h2>Dose X · The rose</h2><img src="../art/rose-window.svg" alt="rose plate"></section>
<section class="plate"><h2>Dose XI · The sanctuary</h2><img src="../art/sanctuary.svg" alt="sanctuary plate"></section>
<section class="small">
  <figure><img src="../art/crossing.svg" alt="crossing at 200px"><figcaption>IX @200px</figcaption></figure>
  <figure><img src="../art/rose-window.svg" alt="rose at 200px"><figcaption>X @200px</figcaption></figure>
  <figure><img src="../art/sanctuary.svg" alt="sanctuary at 200px"><figcaption>XI @200px</figcaption></figure>
</section>
</body>
</html>
