    <g fill="var(--fw-bone)">
      <use href="art/facets.svg#tile-ledger" xlink:href="art/facets.svg#tile-ledger" x="80" y="50" opacity="0.12"/>
      <use href="art/facets.svg#tile-ledger" xlink:href="art/facets.svg#tile-ledger" x="320" y="50" opacity="0.12"/>
      <use href="art/facets.svg#tile-ledger" xlink:href="art/facets.svg#tile-ledger" x="560" y="50" opacity="0.12"/>
      <use href="art/facets.svg#tile-ledger" xlink:href="art/facets.svg#tile-ledger" x="800" y="50" opacity="0.12"/>
      <use href="art/facets.svg#tile-ledger" xlink:href="art/facets.svg#tile-ledger" x="80" y="110" opacity="0.09"/>
      <use href="art/facets.svg#tile-ledger" xlink:href="art/facets.svg#tile-ledger" x="320" y="110" opacity="0.09"/>
      <use href="art/facets.svg#tile-ledger" xlink:href="art/facets.svg#tile-ledger" x="560" y="110" opacity="0.09"/>
      <use href="art/facets.svg#tile-ledger" xlink:href="art/facets.svg#tile-ledger" x="800" y="110" opacity="0.09"/>
      <use href="art/facets.svg#tile-ledger" xlink:href="art/facets.svg#tile-ledger" x="80" y="170" opacity="0.12"/>
      <use href="art/facets.svg#tile-ledger" xlink:href="art/facets.svg#tile-ledger" x="320" y="170" opacity="0.12"/>
      <use href="art/facets.svg#tile-ledger" xlink:href="art/facets.svg#tile-ledger" x="560" y="170" opacity="0.12"/>
      <use href="art/facets.svg#tile-ledger" xlink:href="art/facets.svg#tile-ledger" x="800" y="170" opacity="0.12"/>
    </g>
    <text class="fw-num" x="600" y="310" text-anchor="middle" font-size="220" fill="var(--fw-bone)">29</text>
    <use href="art/facets.svg#shard-tooth" xlink:href="art/facets.svg#shard-tooth" transform="translate(492,50) rotate(8) scale(0.55,2.1)" fill="var(--fw-vermilion)"/>
    <use href="art/facets.svg#shard-tooth" xlink:href="art/facets.svg#shard-tooth" transform="translate(700,62) rotate(-10) scale(0.45,1.9)" fill="var(--fw-vermilion)"/>
    <use href="art/facets.svg#shard-tooth" xlink:href="art/facets.svg#shard-tooth" transform="translate(600,42) rotate(4) scale(0.35,1.5)" fill="var(--fw-vermilion)"/>
    <use href="art/facets.svg#tile-ledger" xlink:href="art/facets.svg#tile-ledger" transform="translate(920,262) rotate(12) scale(0.7)" fill="var(--fw-bone)" opacity="0.42"/>
    <g fill="var(--fw-lampblack)">
      <use href="art/facets.svg#shard-tooth" xlink:href="art/facets.svg#shard-tooth" transform="translate(496,155) rotate(6) scale(0.5,1.0)"/>
      <use href="art/facets.svg#shard-tooth" xlink:href="art/facets.svg#shard-tooth" transform="translate(621,160) rotate(-5) scale(0.45,1.0)"/>
