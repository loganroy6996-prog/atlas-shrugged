    <circle cx="120" cy="120" r="93" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="0.1 5.2" opacity="0.8"/>
  </g>
  <circle cx="120" cy="120" r="86" fill="none" stroke="currentColor" stroke-width="0.75" opacity="0.65"/>
  <g font-family="'IBM Plex Mono',ui-monospace,monospace">
    <g id="sphinx-gap" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- ground: a double ledger rule -->
      <line x1="48" y1="196" x2="192" y2="196" stroke-width="1.2"/>
      <line x1="60" y1="200" x2="180" y2="200" stroke-width="0.75" opacity="0.7"/>
      <!-- SEATED SPHINX facing right (BGE-A1 redraw): haunch, paws, nemes, wing, tail -->
      <g stroke-width="1.5">
        <!-- back → chest → foreleg → ground -->
        <path d="M60,196 C60,172 64,160 78,154 L92,150 C98,156 100,164 100,178 L100,196"/>
        <!-- second foreleg -->
        <path d="M88,158 L88,196" stroke-width="1.25"/>
        <!-- hind leg ground line -->
        <path d="M60,196 L76,196" stroke-width="1.25"/>
        <!-- throat -->
        <path d="M92,150 L94,128"/>
        <!-- face: brow → nose → muzzle → chin -->
        <path d="M94,128 C98,124 104,124 105,129 L104,134 C107,136 107,141 105,145 C103,149 99,151 96,150" stroke-width="1.25"/>
        <!-- nemes headcloth -->
        <path d="M94,128 C92,118 86,112 78,111 C70,110 64,114 63,121 L62,134 C70,131 80,131 90,136 L94,134" stroke-width="1.25"/>
      </g>
      <!-- nemes stripes -->
      <g stroke-width="0.8" opacity="0.85">
        <path d="M72,113 C68,119 67,126 69,132 M79,112 C76,119 75,126 77,133 M86,114 C84,120 84,127 86,132"/>
      </g>
      <!-- ear + eye + mouth -->
      <g stroke-width="1">
        <path d="M87,117 L91,108 L93,117"/>
        <path d="M97,132 L101,132"/>
        <path d="M100,141 L104,140" stroke-width="0.9"/>
      </g>
      <!-- paw toes -->
      <g stroke-width="0.9" opacity="0.85">
        <path d="M84,196 L84,192 M88,196 L88,192 M92,196 L92,192 M96,196 L96,192 M100,196 L100,192"/>
      </g>
      <!-- haunch curve + hatch -->
      <g>
        <path d="M62,180 C70,176 74,168 74,160" stroke-width="1.1"/>
        <path d="M63,172 l10,-2 M63,177 l10,-2 M63,182 l10,-2" stroke-width="0.8" opacity="0.8"/>
      </g>
      <!-- tail curling along the ground -->
      <g stroke-width="1.1">
        <path d="M60,190 C52,188 48,182 50,176 C51,173 54,172 55,174"/>
        <path d="M55,174 l-3,-4 M55,174 l0,-5 M55,174 l3,-4" stroke-width="0.8"/>
      </g>
      <!-- wing: three feathers + edge + barbs -->
      <g stroke-width="1.1">
        <path d="M86,148 C80,132 72,120 62,112 M88,148 C86,130 82,112 78,96 M91,148 C92,130 92,112 90,94"/>
        <path d="M62,112 C70,116 76,106 78,96 C82,106 88,102 90,94" stroke-width="0.9" opacity="0.85"/>
        <path d="M74,128 l6,-2 M72,134 l6,-2 M82,128 l6,-1 M81,134 l6,-1" stroke-width="0.7" opacity="0.8"/>
      </g>
      <!-- STANDING QUESTIONER facing left (BGE-A1 redraw): hood, cloak, arm, staff -->
      <g stroke-width="1.5">
        <!-- hood -->
        <path d="M168,100 C168,92 174,87 181,88 C187,89 190,94 189,100"/>
        <!-- cloak back: neck → heel -->
        <path d="M184,104 C188,120 190,140 191,160 C192,174 193,186 194,196"/>
        <!-- cloak front -->
        <path d="M172,106 C168,124 166,146 166,168 L166,196"/>
        <!-- extended arm toward the sphinx -->
        <path d="M172,120 C162,124 152,126 142,126" stroke-width="1.4"/>
        <!-- staff -->
        <line x1="198" y1="118" x2="198" y2="196" stroke-width="1.4"/>
      </g>
      <g>
        <path d="M172,100 C175,104 180,105 184,103" stroke-width="1"/>
        <path d="M172,100 L169,103" stroke-width="1"/>
        <path d="M142,126 L137,124 M142,126 L137,128" stroke-width="0.9"/>
        <path d="M186,122 C190,130 193,138 195,146" stroke-width="1.2"/>
        <circle cx="198" cy="114" r="2.2" stroke-width="1.1"/>
        <path d="M171,140 C178,143 185,143 191,140" stroke-width="0.9" opacity="0.85"/>
      </g>
      <!-- drapery folds + hem -->
      <g stroke-width="0.8" opacity="0.8">
        <path d="M174,118 C172,140 172,162 173,188 M180,118 C180,142 181,164 182,190 M186,120 C187,142 188,164 189,188"/>
        <path d="M170,196 L170,190 M178,196 L178,190 M186,196 L186,190" opacity="0.85"/>
      </g>
      <!-- THE RIDDLE-GAP: three interrogation marks between the faces -->
      <g stroke-width="1.3">
        <path d="M118,100 q9,0 9,8 q0,6 -5,8 l-2,3"/>
        <circle cx="119" cy="124" r="1.3" fill="currentColor" stroke="none"/>
        <path d="M118,132 q9,0 9,8 q0,6 -5,8 l-2,3"/>
        <circle cx="119" cy="156" r="1.3" fill="currentColor" stroke="none"/>
        <path d="M118,164 q9,0 9,8 q0,6 -5,8 l-2,3"/>
        <circle cx="119" cy="188" r="1.3" fill="currentColor" stroke="none"/>
      </g>
      <!-- stipple: the rendezvous air -->
      <g fill="currentColor" stroke="none" opacity="0.75">
        <circle cx="66" cy="130" r="1"/><circle cx="62" cy="152" r="1"/><circle cx="98" cy="100" r="1"/>
        <circle cx="140" cy="98" r="1"/><circle cx="154" cy="110" r="1"/><circle cx="196" cy="120" r="1"/>
        <circle cx="198" cy="158" r="1"/><circle cx="148" cy="186" r="1"/><circle cx="112" cy="184" r="1"/>
        <circle cx="136" cy="122" r="1"/><circle cx="184" cy="86" r="1"/><circle cx="70" cy="100" r="1"/>
      </g>
    </g>
  </g>
